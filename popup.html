<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile Prankster</title>
  <style>
    :root {
      color-scheme: light;
      font-family: "Segoe UI", system-ui, sans-serif;
    }

    body {
      margin: 0;
      min-width: 260px;
      background: #f6fbff;
      color: #10213a;
    }

    .panel {
      padding: 16px;
    }

    .title {
      margin: 0 0 6px;
      font-size: 16px;
      font-weight: 700;
    }

    .subtitle {
      margin: 0 0 14px;
      font-size: 12px;
      line-height: 1.45;
      color: #4d5d79;
    }

    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 14px;
      border-radius: 14px;
      background: #ffffff;
      box-shadow: 0 10px 24px rgba(16, 33, 58, 0.08);
    }

    .toggle-label {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .toggle-label strong {
      font-size: 14px;
    }

    .toggle-label span {
      font-size: 12px;
      color: #61708c;
    }

    .switch {
      position: relative;
      width: 50px;
      height: 30px;
      display: inline-block;
    }

    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider {
      position: absolute;
      inset: 0;
      cursor: pointer;
      border-radius: 999px;
      background: #cbd5e1;
      transition: background 0.2s ease;
    }

    .slider::before {
      content: "";
      position: absolute;
      left: 4px;
      top: 4px;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: #ffffff;
      transition: transform 0.2s ease;
      box-shadow: 0 2px 6px rgba(15, 23, 42, 0.2);
    }

    input:checked + .slider {
      background: linear-gradient(135deg, #2563eb, #10b981);
    }

    input:checked + .slider::before {
      transform: translateX(20px);
    }

    .status {
      margin-top: 12px;
      font-size: 12px;
      color: #4d5d79;
    }
  </style>
</head>
<body>
  <div class="panel">
    <h1 class="title">Profile Prankster</h1>
    <p class="subtitle">Turn injections on only when you want the prank UI active on Facebook.</p>

    <label class="toggle-row">
      <span class="toggle-label">
        <strong>Enable prank mode</strong>
        <span>Off means the content script stays idle.</span>
      </span>
      <span class="switch">
        <input id="toggle" type="checkbox">
        <span class="slider"></span>
      </span>
    </label>

    <p id="status" class="status">Loading...</p>
  </div>

  <script src="popup.js"></script>
</body>
</html>
